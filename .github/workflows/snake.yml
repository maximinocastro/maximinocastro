name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12 horas
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar SVGs da snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#4C9AFF&color_dots=#161B22,#0E3A7A,#1E6FFF,#4C9AFF,#A8CBFF
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#4C9AFF&color_dots=#161B22,#0E3A7A,#1E6FFF,#4C9AFF,#A8CBFF
            dist/github-snake-light.svg?color_snake=#1E6FFF&color_dots=#EBEDF0,#C6DBFF,#8AB6FF,#4C9AFF,#1E6FFF

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
