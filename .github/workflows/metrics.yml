name: Metrics

# Gera os cards de estatísticas, linguagens, atividade e conquistas
# dentro do próprio repositório (pasta /metrics), sem depender de servidores externos.
# Requer o secret METRICS_TOKEN (Personal Access Token) — veja as instruções.

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia às 00:00 (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # 1) Estatísticas gerais (substitui o GitHub Stats)
      - name: Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/stats.svg
          config_timezone: America/Sao_Paulo
          base: header, activity, community, repositories
          extras_css: |
            h2, h2 svg { color: #4C9AFF !important; fill: #4C9AFF !important; }

      # 2) Top linguagens
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_colors: github
          extras_css: |
            h2, h2 svg { color: #4C9AFF !important; fill: #4C9AFF !important; }

      # 3) Gráfico de atividade (substitui o Activity Graph)
      - name: Activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/activity.svg
          config_timezone: America/Sao_Paulo
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          extras_css: |
            h2, h2 svg { color: #4C9AFF !important; fill: #4C9AFF !important; }

      # 4) Conquistas (substitui o GitHub Trophies)
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          extras_css: |
            h2, h2 svg { color: #4C9AFF !important; fill: #4C9AFF !important; }
